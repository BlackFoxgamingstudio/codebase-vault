[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sovereign-codebase-vault"
version = "1.0.0"
description = "Enterprise codebase static analysis graph engine. Recursively parses 120k+ files across 40+ languages, extracts AST code units, tracks RFC 2119 requirements, calculates technical debt remediation roadmaps, and exposes a high-throughput REST API."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Russell Alan Powers", email = "russell@sovereignbizbox.io"}
]
keywords = ["sovereign", "static analysis & codebase graphs", "microservice", "n8n", "automation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries"
]
dependencies = []

[project.scripts]
sovereign-codebase-vault = "src.cli:main"
